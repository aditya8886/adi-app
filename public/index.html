<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adi</title>
<meta name="description" content="Adi: share photos, clips and moments with your people.">
<meta name="theme-color" content="#ff2e63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Adi">
<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="demo-media.js"></script>
<script src="adi-shim.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-width app; clean white (or true-dark) canvas, edge-to-edge posts, saffron-to-rose brand gradient used only on the logo, moment rings, Create and primary buttons. */
:root{
  --bg:#ffffff; --surface:#ffffff; --soft:#f3f4f6; --ink:#0e1014; --muted:#6c707c; --line:#ebecf0;
  --accent:#ff2e63; --accent-ink:#ffffff; --accent-soft:#ffe8ee; --good:#12b76a; --bad:#ff2e63;
  --g1:#ff9a3c; --g2:#ff2e63; --grad:linear-gradient(135deg,var(--g1),var(--g2));
  --display:"Outfit", "Avenir Next", system-ui, sans-serif;
  --body:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09090b; --surface:#09090b; --soft:#18181c; --ink:#f4f4f6; --muted:#9b9da8; --line:#232329;
  --accent:#ff4d7a; --accent-ink:#ffffff; --accent-soft:#3a1420; --good:#32d583; --bad:#ff4d7a; --g1:#ffa24d; --g2:#ff4d7a; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#09090b; --surface:#09090b; --soft:#18181c; --ink:#f4f4f6; --muted:#9b9da8; --line:#232329;
  --accent:#ff4d7a; --accent-ink:#ffffff; --accent-soft:#3a1420; --good:#32d583; --bad:#ff4d7a; --g1:#ffa24d; --g2:#ff4d7a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent);font-weight:600;text-decoration:none}
.app{max-width:520px;margin:0 auto;min-height:100%;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));border-inline:1px solid var(--line)}
@media (max-width:520px){.app{border-inline:none}}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:-.04em;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;border:none;padding:0}
.logo i{font-style:normal}
.tagline{display:none}
.icons{display:flex;gap:2px;align-items:center}
.ibtn{position:relative;border:none;background:none;padding:8px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.ibtn:hover{background:var(--soft)}
.ibtn svg{width:25px;height:25px}
.badge{position:absolute;top:3px;right:3px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--surface)}
.modes{display:flex;gap:8px;margin-top:10px}
.modes button{border:none;background:var(--soft);padding:7px 14px;border-radius:99px;font-weight:700;font-size:13.5px;color:var(--muted)}
.modes button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 16px;display:flex;flex-direction:column;gap:16px}
.page.flush{padding:0}
h3.h{margin:0;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.01em}
.note{font-size:12.5px;color:var(--muted)}
.pill{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--soft);color:var(--muted);border-radius:99px;padding:3px 9px}
.demo{display:inline-block;vertical-align:middle;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--soft);color:var(--muted);border-radius:5px;padding:1px 5px;margin-left:6px;font-family:var(--body)}
.who b .demo,.who span .demo,.who .pill{display:inline-block;width:auto;overflow:visible}
.verified{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--grad);color:#fff;font-size:9px;margin-left:4px;vertical-align:middle}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:none;background:var(--grad);color:var(--accent-ink);font-weight:700;padding:10px 18px;border-radius:12px;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{padding:7px 14px;font-size:13.5px;border-radius:10px}
.btn.wide{width:100%}
input[type=text],input[type=url],textarea,select{width:100%;min-width:0;font:inherit;color:var(--ink);background:var(--soft);border:1.5px solid transparent;border-radius:12px;padding:11px 14px}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none}
textarea{resize:vertical;min-height:80px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none;background:var(--soft);display:block}
.who{min-width:0;flex:1;text-align:left}
.who b{display:block;font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who span{font-size:12px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkish{background:none;border:none;padding:0}
.empty{background:var(--soft);border-radius:18px;padding:30px 22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty strong{font-family:var(--display);font-size:21px;color:var(--ink);font-weight:700}
.banner{background:var(--grad);color:#fff;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.banner strong{font-family:var(--display);font-size:22px}
.banner .btn{background:#fff;color:#111}
.banner .note{color:rgba(255,255,255,.9)}
/* moments */
.stories{display:flex;gap:14px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);padding-bottom:14px}
.stories::-webkit-scrollbar{display:none}
.st{border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;flex:none}
.st .ring{width:70px;height:70px;border-radius:50%;padding:2.5px;background:var(--line);display:grid;place-items:center;position:relative}
.st .ring.new{background:conic-gradient(from 210deg,var(--g1),var(--g2),#ffcc33,var(--g1))}
.st .ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--surface);background:var(--soft)}
.st .add{position:absolute;right:0;bottom:0;width:23px;height:23px;border-radius:50%;background:var(--grad);color:#fff;font-weight:800;display:grid;place-items:center;border:2.5px solid var(--surface);font-size:15px;line-height:1}
.st span{font-size:11.5px;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* post card: edge to edge */
.card{background:var(--surface);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));border-bottom:1px solid var(--line);padding-bottom:6px}
.post-h{display:flex;align-items:center;gap:10px;padding:4px 8px 10px max(16px,env(safe-area-inset-left,0px))}
.post-h .av{width:38px;height:38px}
.media-wrap{position:relative;background:#000}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.car > *{flex:0 0 100%;scroll-snap-align:center;width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--soft);max-width:100%}
.car video{object-fit:contain;background:#000}
.dots{display:flex;gap:5px;justify-content:center;padding-top:10px;margin-bottom:-4px;position:relative;z-index:1;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.count-tag{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.burst{position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px 0 0 -55px;color:#fff;pointer-events:none;animation:burst .8s ease forwards;filter:drop-shadow(0 6px 16px rgba(0,0,0,.35))}
@keyframes burst{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.15);opacity:1}60%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
.acts{display:flex;align-items:center;gap:0;padding:6px max(8px,env(safe-area-inset-left,0px)) 0}
.act{display:inline-flex;align-items:center;gap:5px;border:none;background:none;padding:8px;border-radius:10px;font-weight:700;font-size:14px}
.act svg{width:26px;height:26px}
.act.on.lk{color:var(--bad)}
.act.on svg{fill:currentColor}
.act.lk.on svg{animation:pop .3s ease}
@keyframes pop{50%{transform:scale(1.25)}}
.tipbtn{border:none;color:#fff;background:var(--grad);border-radius:999px;padding:6px 13px;font-weight:800;font-size:12.5px;margin-left:6px}
.sp{flex:1}
.cap{padding:2px max(16px,env(safe-area-inset-left,0px)) 6px;overflow-wrap:anywhere;white-space:pre-wrap;font-size:14.5px}
.cap b{font-weight:700;margin-right:6px}
.tag{border:none;background:none;padding:0;color:var(--accent);font-weight:600;font-size:inherit}
.meta{padding:0 max(16px,env(safe-area-inset-left,0px)) 6px;font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.meta b{color:var(--ink)}
.meta button{border:none;background:none;padding:0;color:var(--muted);font-size:12.5px}
.reason{background:var(--soft);border-radius:12px;padding:10px 12px;margin:0 max(16px,env(safe-area-inset-left,0px)) 10px;font-size:13px}
.comments{padding:6px max(16px,env(safe-area-inset-left,0px)) 12px;display:flex;flex-direction:column;gap:11px}
.cmt{display:flex;gap:10px;font-size:14px;align-items:flex-start}
.cmt .av{width:30px;height:30px}
.cmt div{min-width:0;flex:1;overflow-wrap:anywhere}
.cmt b{font-weight:700;margin-right:6px}
.cmt small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.cmt small button{border:none;background:none;padding:0;color:var(--muted);font-size:11.5px;margin-left:10px;font-weight:600}
.cform{display:flex;gap:8px}
.done{text-align:center;padding:26px 16px;color:var(--muted)}
.done strong{display:block;font-family:var(--display);font-size:21px;color:var(--ink);margin-bottom:4px}
.done .ok{width:54px;height:54px;border-radius:50%;margin:0 auto 10px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:26px;font-weight:800}
/* grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid button{border:none;padding:0;position:relative;aspect-ratio:1;background:var(--soft);overflow:hidden}
.grid img,.grid video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.grid .gi{position:absolute;right:6px;top:6px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.grid .gi svg{width:17px;height:17px}
.grid span.gl{position:absolute;left:7px;bottom:6px;font-size:11.5px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.grid.explore{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.grid.explore button:nth-child(10n+3){grid-row:span 2;aspect-ratio:auto}
/* profile */
.prof{display:flex;flex-direction:column;gap:12px}
.prof-h{display:flex;gap:18px;align-items:center}
.prof h2{font-family:var(--display);font-size:22px;margin:0;line-height:1.15;overflow-wrap:anywhere;font-weight:700}
.stats{display:flex;gap:6px;flex:1;justify-content:space-around;text-align:center;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-size:19px;display:block;font-family:var(--display);font-weight:700}
.bio{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.ptabs{display:flex;border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.ptabs button{flex:1;border:none;background:none;padding:12px 0;font-weight:700;color:var(--muted);border-bottom:2px solid transparent}
.ptabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.ptabs + .grid,.ptabs + .empty{margin-top:-14px}
.ptabs + .grid{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.panel{background:var(--soft);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--soft);border-radius:16px;padding:14px}
.kpi:first-child{background:var(--grad);color:#fff}
.kpi:first-child span{color:rgba(255,255,255,.9)}
.kpi b{display:block;font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.bars i{display:block;width:100%;background:var(--grad);border-radius:6px 6px 2px 2px;min-height:3px}
.bars small{font-size:10px;color:var(--muted);white-space:nowrap}
.bars em{font-style:normal;font-size:10px;font-weight:800;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad)}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.check i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px;flex:none;background:var(--line);color:var(--muted)}
.check i.ok{background:var(--good);color:#fff}
.top-post{display:flex;gap:12px;align-items:center;border:none;background:none;padding:0;text-align:left;width:100%}
.top-post img,.top-post video{width:54px;height:54px;border-radius:10px;object-fit:cover;background:var(--line);flex:none}
/* people / activity */
.person{display:flex;align-items:center;gap:12px;padding:6px 0}
.person .av{width:46px;height:46px}
.sugg{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.sugg::-webkit-scrollbar{display:none}
.sg{flex:none;width:150px;background:var(--soft);border-radius:16px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.sg .av{width:64px;height:64px}
.sg b{font-size:13.5px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg span{font-size:11.5px;color:var(--muted)}
.sg .btn{width:100%;margin-top:4px}
.act-item{display:flex;align-items:center;gap:12px;padding:10px 0}
.act-item .txt{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.act-item .txt small{color:var(--muted);margin-left:4px}
.act-item .thumb{width:46px;height:46px;border-radius:8px;object-fit:cover;background:var(--soft);flex:none}
.act-item .av{width:44px;height:44px}
.act-item.new .txt::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:middle}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:none;background:var(--soft);border-radius:99px;padding:7px 14px;font-weight:700;font-size:13px;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
/* create */
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:none;background:none;border-radius:11px;padding:9px 0;font-weight:800;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.drop{border:2px dashed var(--line);border-radius:18px;padding:40px 16px;text-align:center;color:var(--muted);background:var(--soft);display:block;cursor:pointer}
.drop strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.prev{position:relative;border-radius:16px;overflow:hidden;background:#000}
.prev .car > *{aspect-ratio:var(--ar,4/5)}
.filters{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:700;flex:none;color:var(--muted)}
.filters button img{width:66px;height:66px;object-fit:cover;border-radius:12px;border:2.5px solid transparent}
.filters button[aria-pressed="true"]{color:var(--ink)}
.filters button[aria-pressed="true"] img{border-color:var(--accent)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-top:6px}
.thumbs div{position:relative;flex:none}
.thumbs img{width:58px;height:58px;object-fit:cover;border-radius:10px;display:block}
.thumbs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:none;background:var(--ink);color:var(--surface);font-size:13px;line-height:1;padding:0}
/* clips */
.reels{height:calc(100dvh - 58px - env(safe-area-inset-top,0px));overflow-y:auto;scroll-snap-type:y mandatory;background:#000}
.reel{height:100%;scroll-snap-align:start;position:relative;display:grid;place-items:center;overflow:hidden}
.reel video{width:100%;height:100%;object-fit:cover}
.reel .r-info{position:absolute;left:0;right:64px;bottom:0;padding:16px 16px calc(104px + env(safe-area-inset-bottom,0px));color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));display:flex;flex-direction:column;gap:8px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.reel .r-info .tag{color:#fff;font-weight:700}
.reel .r-info .who b,.reel .r-info .who span{color:#fff}
.reel .r-info .demo{background:rgba(255,255,255,.2);color:#fff}
.reel .r-info .btn{background:transparent;border:1.5px solid #fff;color:#fff}
.reel .r-side{position:absolute;right:6px;bottom:calc(104px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;align-items:center;color:#fff}
.reel .r-side button{border:none;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:800;padding:4px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.reel .r-side svg{width:31px;height:31px}
.reel .r-side .on.lk{color:#ff4d7a}
.reel .r-side .on svg{fill:currentColor}
.reel .mute{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:800}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:520px;margin:0 auto;display:flex}

// Dosti streaks: days in a row you and a friend both sent each other something
function sentDays(a,b){ const u=U(a), days=new Set(); if(!u) return days; const bp=new Set((U(b)?.posts||[]).map(p=>p.id));
  const tids=new Set(allThreads().filter(t=>!t.members.includes("*") && t.members.includes(a) && t.members.includes(b)).map(t=>t.id));
  [...(u.msgs||[]), ...S.pmsg.filter(m=>m._owner===a)].forEach(m=>{ if(tids.has(m.tid)) days.add(dayKey(m.at)); });
  (u.comments||[]).forEach(c=>{ if(bp.has(c.pid)) days.add(dayKey(c.at)); });
  Object.entries(u.likes||{}).forEach(([pid,v])=>{ if(bp.has(pid) && typeof v==="number") days.add(dayKey(v)); });
  (u.tips||[]).forEach(t=>{ if(t.to===b) days.add(dayKey(t.at)); });
  return days; }
function dosti(uid){ if(!S.meId || uid===S.meId || !U(uid) || !mine()) return {n:0}; const a=sentDays(S.meId,uid), demo=isDemo(uid), b=demo?null:sentDays(uid,S.meId);
  const both=k=>a.has(k) && (demo || b.has(k)); const todayDone=both(dayKey()); let t=Date.now(), n=0; if(!todayDone) t-=DAY; while(both(dayKey(t))){ n++; t-=DAY; }
  return {n, todayDone, risk:n>0 && !todayDone}; }
const dostiTag = uid => { const d=dosti(uid); return d.n ? `<span class="dosti ${d.risk?"risk":""}" title="Dosti streak: ${d.n} day${d.n==1?"":"s"} in a row">${ic("dosti")}${d.n}</span>` : ""; };
function dostiLine(uid){ const d=dosti(uid); if(!d.n) return ""; return `<div class="dostiline">${ic("dosti")}<div><b>${d.n}-day Dosti streak</b><span class="note">${d.risk?`Send ${esc(name(uid))} something today to keep it going.`:"You both sent something today. See you tomorrow!"}${isDemo(uid)?" Demo accounts count as replying.":""}</span></div></div>`; }

function drawFrame(c, f){ const x=c.getContext("2d"), w=c.width, h=c.height, lw=Math.round(Math.min(w,h)*.035);
  const g=x.createLinearGradient(0,0,w,h); g.addColorStop(0,f.g[0]); g.addColorStop(1,f.g[1]); x.lineWidth=lw; x.strokeStyle=g; x.strokeRect(lw/2,lw/2,w-lw,h-lw);
  x.fillStyle="rgba(255,255,255,.9)"; for(let i=0;i<=24;i++){ const px=lw/2+i/24*(w-lw); x.beginPath(); x.arc(px, lw/2, lw*.2, 0, 7); x.fill(); x.beginPath(); x.arc(px, h-lw/2, lw*.2, 0, 7); x.fill(); }
  const fs=Math.round(Math.min(w,h)*.06); x.font=`800 ${fs}px Outfit, system-ui, sans-serif`; x.textBaseline="bottom"; x.shadowColor="rgba(0,0,0,.5)"; x.shadowBlur=fs*.5; x.fillStyle="#fff"; x.fillText("Happy "+f.n, lw*1.8, h-lw*1.6); x.shadowBlur=0; }

function feed(){
  const hidden = new Set(S.priv.hidden||[]);
  const posts = allPosts().filter(p => !hidden.has(p.id) && !isLater(p));
  if(S.mode==="following"){ const f=new Set([...following(S.meId), S.meId]); return posts.filter(p=>f.has(p.author)).sort((a,b)=>b.at-a.at); }
  if(S.mode==="friends"){ const f=new Set((mine()?.close)||[]); return posts.filter(p=>f.has(p.author)).sort((a,b)=>b.at-a.at); }
  const f=new Set([...following(S.meId), S.meId]);
  let pool=posts.filter(p=>!f.has(p.author)); if(!pool.length) pool=posts.filter(p=>p.author!==S.meId);
  if(S.mood!=="all") pool=posts.filter(p=>p.author!==S.meId && moodOf(p)===S.mood);
  return pool.sort((a,b)=>score(b)-score(a));
}
function reasonFor(p){
  if(p.author===S.meId) return "This is your post. Everyone who follows you sees it in My people, newest first. Nobody can pay to push their post above yours.";
  if(S.mode==="following") return `You follow ${name(p.author)}. My people shows only people you follow, newest first, with no ads and no reordering.`;
  if(S.mode==="friends") return `${name(p.author)} is on your Besties list. Only people you add there appear in this tab.`;
  const l=likeCount(p.id), c=commentsOn(p.id).length, h=Math.round((Date.now()-p.at)/3600e3), bits=[];
  if(l) bits.push(`${l} like${l==1?"":"s"}`); if(c) bits.push(`${c} comment${c==1?"":"s"}`);
  return `You don't follow ${name(p.author)} yet. Fresh ranks posts by loves, replies and how new they are. This one has ${bits.length?bits.join(" and "):"no reactions yet"} and was posted ${h<1?"under an hour":h+" hour"+(h==1?"":"s")} ago.`;
}

function activity(){
  if(!S.meId) return [];
  const myPosts = new Map((mine()?.posts||[]).map(p=>[p.id,p])), ev=[], h=handleOf(S.meId).toLowerCase();
  for(const [uid,u] of Object.entries(S.users)){
    if(uid===S.meId) continue;
    for(const [pid,v] of Object.entries(u.likes||{})) if(myPosts.has(pid)) ev.push({t:"like", from:uid, pid, at: typeof v==="number"?v:0});
    for(const c of u.comments||[]){
      if(myPosts.has(c.pid)) ev.push({t:"comment", from:uid, pid:c.pid, text:c.text, at:c.at});
      else if(h && c.text.toLowerCase().includes("@"+h)) ev.push({t:"mention", from:uid, pid:c.pid, text:c.text, at:c.at});
    }
    if((u.following||[]).includes(S.meId)) ev.push({t:"follow", from:uid, at:(u.followAt||{})[S.meId]||0});
    for(const t of u.tips||[]) if(t.to===S.meId) ev.push({t:"tip", from:uid, pid:t.pid, amt:t.amt, at:t.at});
    for(const p of u.posts||[]) if(p.collab===S.meId) ev.push({t:"collab", from:uid, pid:p.id, at:p.at});
    const sb=(u.subs||{})[S.meId]; if(sb) ev.push({t:"sub", from:uid, amt:sb.amt, at:sb.at});
    for(const c of (mine()?.challenges||[])) if((u.joined||{})[c.id]) ev.push({t:"chjoin", from:uid, text:c.title, at:u.joined[c.id]});
    for(const m of (mine()?.meetups||[])) if((u.going||{})[m.id]) ev.push({t:"rsvp", from:uid, text:m.title, at:u.going[m.id]});
  }
  for(const q of S.qs) if(q.to===S.meId) ev.push({t:"question", from:S.meId, text:q.text, at:q.at});
  return ev.sort((a,b)=>b.at-a.at).slice(0,150);
}

function saveMine(mutate, quiet){

async function processImage(file, ar, frame, max){
  const bmp = await createImageBitmap(file);
  let sw=bmp.width, sh=bmp.height, sx=0, sy=0;
  if(ar && ar!=="orig"){ const [a,b]=ar.split("/").map(Number), r=a/b; if(sw/sh>r){ const nw=sh*r; sx=(sw-nw)/2; sw=nw; } else { const nh=sw/r; sy=(sh-nh)/2; sh=nh; } }
  const k=Math.min(1, (max||1080)/Math.max(sw,sh)), c=document.createElement("canvas"); c.width=Math.round(sw*k); c.height=Math.round(sh*k);
  c.getContext("2d").drawImage(bmp, sx, sy, sw, sh, 0, 0, c.width, c.height);
  if(frame) drawFrame(c, frame);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
}

// ---------- UI helpers ----------
let toastTimer;
function toast(msg){ let t=$("#toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t); } t.textContent=msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true,3800); }
function openSheet(html, kind){ closeSheet(); const el=document.createElement("div"); el.className="sheet-bg"; el.id="sheet"; el.dataset.kind=kind||""; el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`; document.body.appendChild(el); el.addEventListener("click", e => { if(e.target===el || e.target.closest("[data-close]")) closeSheet(); }); el.querySelector("button,input,select")?.focus(); }
function closeSheet(){ $("#sheet")?.remove(); }
function closeSheetIf(kind){ if($("#sheet")?.dataset.kind===kind) closeSheet(); }
function openTip(p){
  openSheet(`<h3>Shabashi ${esc(name(p.author))}</h3>${goalBox(p.author, true)}
    <div class="note">In this prototype, shabashi are a preview and no money moves. In the real app, shabashi goes into the creator's Kamai balance, and they withdraw it to UPI.</div>
    <div class="amts"><button data-amt="10">₹10</button><button data-amt="50">₹50</button><button data-amt="100">₹100</button></div>
    <button class="btn ghost" data-close>Cancel</button>`, "tip");
  $("#sheet").addEventListener("click", e => { const a=e.target.closest("[data-amt]"); if(a) tip(p, +a.dataset.amt); });
}
function openMenu(p){
  const own = p.author===S.meId, saved=(S.priv.saved||[]).includes(p.id);
  openSheet(`<h3>Post options</h3>
    <a class="menu-item" style="color:var(--ink)" href="https://wa.me/?text=${encodeURIComponent(`${name(p.author)} on Adi: ${(p.caption||"").slice(0,120)}\n${ARTIFACT_URL}#post-${p.id}`)}" target="_blank" rel="noopener noreferrer" data-close>Share on WhatsApp</a>
    <button class="menu-item" data-act="copy">Copy link</button>
    <button class="menu-item" data-act="why">Why am I seeing this?</button>
    ${p.caption?`<button class="menu-item" data-act="tr">${S.tr["p:"+p.id]?.text?"Hide translation":"Translate caption (Hinglish ⇄ English)"}</button>`:""}
    <button class="menu-item" data-act="save">${saved?"Remove from Kept":"Keep post"}</button>
    <button class="menu-item" data-act="col">Add to a collection</button>
    ${own ? `<button class="menu-item" data-act="edit">Edit caption</button><button class="menu-item danger" data-act="del">Delete post</button>` :
      `<button class="menu-item" data-act="hide">Not interested</button>
       <button class="menu-item danger" data-act="report">Report post</button>
       <button class="menu-item" data-act="follow">${iFollow(p.author)?"Unfollow":"Follow"} ${esc(name(p.author))}</button>
       ${iFollow(p.author)?`<button class="menu-item" data-act="close">${(mine()?.close||[]).includes(p.author)?"Remove from":"Add to"} Besties</button>`:""}`}
    <button class="btn ghost" data-close>Cancel</button>`, "menu");
  $("#sheet").addEventListener("click", e => {
    const a=e.target.closest("[data-act]")?.dataset.act; if(!a) return;
    if(a==="edit") return openEditCaption(p);
    if(a==="col") return openColPick(p.id);
    if(a==="why"){ closeSheet(); S.openWhy[p.id]=!S.openWhy[p.id]; return render(); }
    if(a==="tr"){ closeSheet(); return translate("p:"+p.id); }
    if(a==="report") return openReport({pid:p.id, uid:p.author});
    if(a==="copy") copyLink(p.id); else if(a==="save"){ toggleSave(p.id); closeSheet(); } else if(a==="del") removePost(p.id);
    else if(a==="hide") hidePost(p.id); else if(a==="follow"){ follow(p.author); closeSheet(); } else if(a==="close"){ toggleClose(p.author); closeSheet(); }
  });
}
function openProfileMenu(uid){
  const me=uid===S.meId, fan=(mine()?.subs||{})[uid], best=(mine()?.close||[]).includes(uid), last=allPosts().filter(p=>p.author===uid).sort((a,b)=>b.at-a.at)[0];
  openSheet(`<h3>${me?"More":esc(name(uid))}</h3>
    ${me ? `<button class="menu-item" data-pa="goal">${ic("goal")} ${goalOf(S.meId)?"Edit shabashi goal":"Set a shabashi goal"}</button><button class="menu-item" data-pa="earn">${ic("coin")} How creators earn</button><button class="menu-item" data-pa="invite">${ic("users")} Invite friends on WhatsApp</button><button class="menu-item" data-pa="time">${ic("clock")} Your time on Adi</button><button class="menu-item" data-pa="fb">${ic("comment")} Send feedback</button>${S.canEdit?`<button class="menu-item" data-pa="fball">${ic("chart")} Tester feedback</button>`:""}<button class="menu-item" data-pa="settings">${ic("gear")} Settings</button>`
      : `<button class="menu-item" data-pa="fan">${ic("star")} ${fan?"Your fan plan":"Become a fan"}</button>
         ${last?`<button class="menu-item" data-pa="tip">${ic("coin")} Send shabashi</button>`:""}
         ${iFollow(uid)?`<button class="menu-item" data-pa="best">${ic("heart")} ${best?"Remove from Besties":"Add to Besties"}</button>`:""}
         <button class="menu-item" data-pa="ask">${ic("comment")} Ask anonymously</button>
         <button class="menu-item danger" data-pa="report">Report</button><button class="menu-item danger" data-pa="block">Block</button>`}
    <button class="btn ghost" data-close>Cancel</button>`, "pmenu");
  $("#sheet").addEventListener("click", e => { const a=e.target.closest("[data-pa]")?.dataset.pa; if(!a) return; closeSheet();
    if(a==="goal") return openGoal();
    if(a==="time") openTime(); else if(a==="settings") openSettings(); else if(a==="fan") openSubs(uid);
    else if(a==="tip" && last) openTip(last); else if(a==="best") toggleClose(uid); else if(a==="ask"){ S.ptab="qa"; render(); setTimeout(()=>$("#ask-in")?.focus(),50); }
    else if(a==="earn") go("earn"); else if(a==="invite") openInvite(); else if(a==="fb") openFeedback(); else if(a==="fball") go("feedback");
    else if(a==="report") openReport({uid}); else if(a==="block") blockUser(uid); });
}
function sendFeedback(item){
  if(!guard()) return false;
  const items=[{id:Date.now().toString(36), at:Date.now(), ...item}, ...S.fb].slice(0,100); S.fb=items;
  S.db.doc("feedback/"+S.meId).set({items}).catch(()=>toast("Couldn't send that. Try again."));
  return true;
}
function openFeedback(){
  openSheet(`<h3>Send feedback</h3><div class="note">Tell us what to fix or add. Only the Adi team reads this.</div>
    <div class="chips">${[["idea","Idea"],["problem","Something's broken"],["other","Other"]].map(([k,l],i)=>`<button class="chip" data-fbt="${k}" aria-pressed="${i===0}">${l}</button>`).join("")}</div>
    <textarea id="fb-t" maxlength="1000" placeholder="What would make Adi better for you?" aria-label="Feedback"></textarea>
    <button class="btn" id="fb-go">Send</button><button class="btn ghost" data-close>Cancel</button>`, "fb");
  let type="idea"; $("#sheet").addEventListener("click", e=>{ const b=e.target.closest("[data-fbt]"); if(!b) return; type=b.dataset.fbt; document.querySelectorAll("[data-fbt]").forEach(x=>x.setAttribute("aria-pressed", x===b)); });
  $("#fb-go").onclick=()=>{ const t=$("#fb-t").value.trim(); if(!t) return toast("Write a line first."); if(sendFeedback({type, text:t})){ closeSheet(); toast("Thank you! The Adi team will read this."); } };
}
function openReport(target){
  const reasons=["Spam","Bullying or hate","Nudity or sexual content","Fake account or scam","Violence or danger","Something else"];
  openSheet(`<h3>Report ${target.pid?"post":esc(name(target.uid))}</h3><div class="note">Reports are private. The person won't know it was you. A real person reviews every report.</div>
    ${reasons.map(r=>`<button class="menu-item" data-rr="${esc(r)}">${esc(r)}</button>`).join("")}<button class="btn ghost" data-close>Cancel</button>`, "report");
  $("#sheet").addEventListener("click", e=>{ const b=e.target.closest("[data-rr]"); if(!b) return;
    if(sendFeedback({type:"report", text:b.dataset.rr, pid:target.pid||"", uid:target.uid||""})){ closeSheet(); if(target.pid) savePriv(d=>{ d.hidden=[...(d.hidden||[]), target.pid].slice(-500); });
      openSheet(`<h3>Thanks for reporting</h3><div class="note">We've hidden it for you. Want to stop seeing ${esc(name(target.uid))} completely?</div><button class="btn" data-blk="${esc(target.uid)}">Block ${esc(name(target.uid))}</button><button class="btn ghost" data-close>Not now</button>`, "report2"); } });
}
function blockUser(uid){ const n=name(uid); savePriv(d=>{ d.blocked=[...new Set([...(d.blocked||[]), uid])]; }); closeSheet();
  if(S.view==="profile" && S.profileOf===uid) go("home"); toast(`${n} is blocked. You won't see their posts, replies, moments or chats.`); }
function inviteLink(){ return ARTIFACT_URL+"#ref-"+S.meId; }
function openInvite(){
  const msg=`Join me on Adi, the Made in India social app where creators earn from day 1 🇮🇳\n${inviteLink()}`;
  const n=Object.values(S.raw).filter(u=>u.invitedBy===S.meId).length;
  openSheet(`<h3>Invite friends</h3><div class="note">Friends who join from your link show "Invited by you", and you get a Connector badge after 3 invites.</div>
    <a class="btn" style="text-align:center" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener noreferrer">Invite on WhatsApp</a>
    <button class="btn ghost" id="inv-copy">Copy invite link</button>
    <div class="note">${n} friend${n==1?"":"s"} joined from your link. In this test version, the owner also has to add them from the Share menu before they can open Adi.</div>
    <button class="btn ghost" data-close>Close</button>`, "invite");
  $("#inv-copy").onclick=async()=>{ try{ await navigator.clipboard.writeText(inviteLink()); toast("Invite link copied."); }catch(e){ toast(inviteLink()); } };
}
function feedbackView(){
  const all=S.fbAll.flatMap(d=>(d.items||[]).map(x=>({...x, from:d.id}))).sort((a,b)=>b.at-a.at);
  const lab={idea:"Idea", problem:"Problem", other:"Other", report:"Report"};
  return `<button class="btn ghost sm" data-go="me" style="align-self:flex-start">${ic("back")}Profile</button>
    <h3 class="h">Tester feedback · ${all.length}</h3><div class="note">Only you and other admins can see this list.</div>
    ${all.length?all.map(x=>`<div class="fb-item"><div class="row" style="justify-content:space-between"><span class="pill">${lab[x.type]||x.type}</span><span class="note">${esc(name(x.from))} · ${ago(x.at)}</span></div><div>${esc(x.text)}</div>${x.pid?`<button class="linkish note" data-open="${esc(x.pid)}" style="align-self:flex-start">Open reported post</button>`:""}${x.uid&&!x.pid?`<button class="linkish note" data-profile="${esc(x.uid)}" style="align-self:flex-start">Open reported account</button>`:""}</div>`).join("")
      : `<div class="empty"><strong>No feedback yet</strong>When testers send ideas, problems or reports, they show up here.</div>`}`;
}
function openEditCaption(p){
  openSheet(`<h3>Edit caption</h3><textarea id="ec" maxlength="2200" aria-label="Caption">${esc(p.caption||"")}</textarea><input type="text" id="el" maxlength="60" placeholder="Location" value="${esc(p.location||"")}" aria-label="Location"><button class="btn" id="ec-save">Save</button><button class="btn ghost" data-close>Cancel</button>`, "editcap");
  $("#ec-save").onclick=()=>{ const c=$("#ec").value.trim().slice(0,2200), l=$("#el").value.trim().slice(0,60); if(saveMine(d=>{ const x=d.posts.find(q=>q.id===p.id); if(x){ x.caption=c; x.location=l; x.edited=true; } })){ closeSheet(); toast("Caption updated."); } };
}
async function setAvatar(file){
  if(!file) return; if(!/^image\/(jpeg|png|webp)$/.test(file.type)) return toast("Use a JPG, PNG or WebP photo.");
  toast("Uploading your photo…");
  try{ const b=await processImage(file, "1/1", null, 400), up=await upload(b, "image/jpeg"), old=mine()?.avatar;
    if(saveMine(d=>{ d.avatar=up.id; })){ if(old) S.assets.delete(old).catch(()=>{}); const im=$("#e-av"); if(im) im.src=blob(up.id); toast("Photo updated."); } }
  catch(e){ toast(UPERR[e?.code] || "Couldn't upload that photo. Try again."); }
}
function openPeople(title, ids){
  openSheet(`<h3>${esc(title)}</h3>${ids.length?ids.map(personRow).join(""):`<div class="note">No one yet.</div>`}<button class="btn ghost" data-close>Close</button>`, "people");
}
function openEditProfile(){
  const u = mine() || blank();
  openSheet(`<h3>Edit profile</h3>
    <div class="row" style="flex-wrap:nowrap"><img class="av" id="e-av" src="${esc(avatar(S.meId))}" alt="" style="width:64px;height:64px"><label class="btn ghost sm" style="cursor:pointer">Change photo<input type="file" id="e-avf" accept="image/jpeg,image/png,image/webp" hidden></label>${u.avatar?`<button class="btn ghost sm" id="e-avx">Remove</button>`:""}</div>
    <label class="f">Name<input type="text" id="e-name" maxlength="40" value="${esc(u.displayName||S.prof[S.meId]?.name||"")}" placeholder="Your name" autocomplete="name"></label>
    <label class="f">Username<input type="text" id="e-handle" maxlength="20" value="${esc(u.handle)}" placeholder="e.g. shubham.creates" autocomplete="off"></label>
    <div class="note" id="e-hmsg">3 to 20 letters, numbers, dots or underscores. People can @mention you with it.</div>
    <label class="f">Category<select id="e-cat">${CATS.map(c=>`<option ${c===u.category?"selected":""}>${c}</option>`).join("")}</select></label>
    <label class="f">Bio<textarea id="e-bio" maxlength="150" placeholder="What do you post about?">${esc(u.bio)}</textarea></label>
    <label class="f">Link<input type="url" id="e-link" maxlength="200" value="${esc(u.link)}" placeholder="https://your-site.com"></label>
    <button class="btn" id="e-save">Save profile</button><button class="btn ghost" data-close>Cancel</button>`, "edit");
  $("#e-avf").onchange = e => setAvatar(e.target.files[0]);
  const ax=$("#e-avx"); if(ax) ax.onclick = () => { const old=mine()?.avatar; if(saveMine(d=>{ delete d.avatar; })){ if(old) S.assets.delete(old).catch(()=>{}); closeSheet(); toast("Photo removed."); } };
  $("#e-save").onclick = () => {
    const h=$("#e-handle").value.trim().replace(/^@/,"").toLowerCase(), link=$("#e-link").value.trim();
    if(h && !/^[a-z0-9_.]{3,20}$/.test(h)){ $("#e-hmsg").textContent="Usernames use 3 to 20 letters, numbers, dots or underscores."; return; }
    const taken = h && Object.keys(S.users).some(id => id!==S.meId && (U(id).handle||"").toLowerCase()===h);
    if(taken){ $("#e-hmsg").textContent=`@${h} is taken. Try another.`; return; }
    if(link && !/^https:\/\/[^\s]+$/.test(link)){ toast("Links must start with https://"); return; }
    const nm=$("#e-name").value.trim().slice(0,40); if(nm.length<2){ $("#e-hmsg").textContent="Add your name (at least 2 letters)."; return; }
    if(saveMine(d => { d.displayName=nm; d.handle=h; d.category=$("#e-cat").value; d.bio=$("#e-bio").value.trim().slice(0,150); d.link=link; })){ closeSheet(); toast("Profile saved."); }
  };
}

function openSubs(uid){
  if(!canEarn(uid,"fans")){ const n=folCount(uid), me=uid===S.meId;

      ${!me&&!iFollow(uid)?`<button class="btn" data-follow="${esc(uid)}">Follow</button>`:""}${!me&&allPosts().some(p=>p.author===uid&&!isLater(p))?`<button class="btn alt" data-goaltip="${esc(uid)}">Send shabashi</button>`:""}<button class="btn ghost" data-close>Close</button>`, "subs"); }

    ${cur?`<button class="btn ghost" data-tier="0">Cancel my plan</button>`:""}<button class="btn ghost" data-close>Close</button>`, "subs");

function openNewChallenge(){
  openSheet(`<h3>Start a challenge</h3>
    <label class="f">Name<input type="text" id="ch-t" maxlength="50" placeholder="e.g. 30 days of sketching"></label>

// ---------- moment viewer ----------
let SV=null;
function storyQueue(){ const src=following(S.meId).length?following(S.meId):Object.keys(S.users).filter(id=>id!==S.meId); return [S.meId, ...src].filter(id=>liveStories(id).length); }
function openStories(uid){
  const q=storyQueue(); let ui=q.indexOf(uid); if(ui<0){ q.unshift(uid); ui=0; }
  const list=liveStories(uid), firstUnseen=list.findIndex(s=>!S.priv.seen?.[s.id]);
  SV={q, ui, si: firstUnseen<0?0:firstUnseen, t0:0, raf:0, paused:false, seen:{}};
  const el=document.createElement("div"); el.className="sv"; el.id="sv"; el.setAttribute("role","dialog"); el.setAttribute("aria-label","Moments"); document.body.appendChild(el); storyGestures(el);
  showStory();
}
function storyGestures(el){
  let y0=null, hold=null;
  el.addEventListener("pointerdown", e=>{ if(e.target.closest("input,button.sv-x,#sv-del,#sv-like")) return; y0=e.clientY; hold=setTimeout(()=>{ if(SV) SV.paused=true; }, 220); });
  el.addEventListener("pointerup", e=>{ clearTimeout(hold); if(SV && SV.paused && !document.activeElement?.closest?.("#sv-reply")){ SV.paused=false; } if(y0!=null && e.clientY-y0>90) closeStories(); y0=null; });
}
function showStory(){

    ${m.type==="video" ? `<video src="${blob(m.id)}" autoplay playsinline id="sv-media"></video>` : `<img src="${blob(m.id)}" alt="Moment" class="f-${esc(m.filter||"normal")}" id="sv-media">`}
    <div class="sv-bars">${list.map((x,i)=>`<div><i style="width:${i<SV.si?100:0}%" ${i===SV.si?'id="sv-bar"':""}></i></div>`).join("")}</div>

    <div class="sv-foot">${own ? `<span class="note" style="color:#fff">${s.besties?"Seen only by your Besties.":"Seen by people who follow you."} Disappears ${Math.max(1,Math.round((DAY-(Date.now()-s.at))/3600e3))}h from now.</span><span class="sp"></span><button class="btn ghost sm" id="sv-del">Delete</button>`
      : `<input type="text" id="sv-reply" placeholder="Send a reply to their latest post…" autocomplete="off" aria-label="Reply"><button class="btn ghost sm icon" id="sv-like" aria-label="Love">${ic("heart")}</button>`}</div></div>`;
  $("#sv-x").onclick=closeStories; $("#sv-prev").onclick=()=>stepStory(-1); $("#sv-next").onclick=()=>stepStory(1);
  const del=$("#sv-del"); if(del) del.onclick=async()=>{ const id=s.id, mid=m.id; saveMine(d=>{ d.stories=(d.stories||[]).filter(x=>x.id!==id); }, true); try{ await S.assets?.delete(mid); }catch(e){} toast("Moment deleted."); closeStories(); };
  const lk=$("#sv-like"); if(lk) lk.onclick=()=>{ const p=(U(uid).posts||[])[0]; if(p){ like(p.id,true); toast(`You loved ${name(uid)}'s latest post.`); } else toast(`${name(uid)} has no posts to love yet.`); };
  const rp=$("#sv-reply"); if(rp){ rp.onfocus=()=>SV.paused=true; rp.onblur=()=>{ SV.paused=false; SV.t0=performance.now()-SV.el; }; rp.onkeydown=e=>{ if(e.key==="Enter"&&rp.value.trim()){ const p=(U(uid).posts||[])[0]; if(p){ comment(p.id, "Re your story: "+rp.value); toast("Reply sent as a reply on their latest post."); } else toast(`${name(uid)} has no posts to reply to yet.`); rp.value=""; rp.blur(); } }; }
  const dur = m.type==="video" ? 15000 : 5000; SV.el=0; SV.t0=performance.now();
  const vid = m.type==="video" ? $("#sv-media") : null;

function stepStory(dir){

function closeStories(){ if(!SV) return; cancelAnimationFrame(SV.raf); const seen=SV.seen; SV=null; $("#sv")?.remove();
  const fresh=Object.keys(seen).filter(k=>!S.priv.seen?.[k]); if(fresh.length) savePriv(d=>{ d.seen={...(d.seen||{})}; fresh.forEach(k=>d.seen[k]=Date.now()); for(const k in d.seen) if(Date.now()-d.seen[k]>2*DAY) delete d.seen[k]; }); else render(); }

const HI_PH = {"Search people, @usernames or #hashtags":"लोग, @यूज़रनेम या #हैशटैग खोजें","Add a reply… use @ to mention":"जवाब लिखें… @ से किसी को टैग करें","Message…":"मैसेज…","Your question…":"आपका सवाल…","Your answer…":"आपका जवाब…",
 "Write a caption… add #hashtags and @mentions. Hinglish welcome.":"कैप्शन लिखें… #हैशटैग और @मेंशन जोड़ें","What would make Adi better for you?":"Adi को आपके लिए बेहतर क्या बनाएगा?"};
const SKIP = ".cap,.cmt div,.bio,.msg,.qa,.tr,.gtext,.who,.sg b,.fb-item,.reason,.lb span,textarea,.deal,.r-info";
function i18n(root){
  if(S.lang!=="hi") return; root=root||document.body;
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT); const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  for(const n of nodes){ const t=n.nodeValue.trim(); if(!t || !HI[t]) continue; const el=n.parentElement; if(!el || el.closest(SKIP)) continue; n.nodeValue=n.nodeValue.replace(t, HI[t]); }
  root.querySelectorAll?.("[placeholder]").forEach(el=>{ const t=el.getAttribute("placeholder"); if(HI_PH[t]) el.setAttribute("placeholder", HI_PH[t]); });
}
let i18nQ=false; new MutationObserver(()=>{ if(S.lang!=="hi"||i18nQ) return; i18nQ=true; requestAnimationFrame(()=>{ i18nQ=false; i18n(); }); }).observe(document.body, {childList:true, subtree:true});
i18n();
(async () => {
  const c=window.claude;
  if(!c || !c.use){ S.failed="Adi didn't load properly. Check your connection and reload."; return render(); }
  const [db,user,assets]=await Promise.all([c.use("db"), c.use("user"), c.use("assets")]);
  S.db=db; S.user=user; S.assets=assets;
  if(!db){ S.failed=window.ADI_NOT_CONFIGURED ? "Adi isn't connected to its database yet. Add the Supabase details to config.js." : "Adi couldn't connect. Check your connection and reload."; return render(); }
  S.meId = user ? await user.id() : null;
  if(!S.meId){ S.failed="Adi couldn't tell who you are. Log out and log in again."; return render(); }
  if(user){ const cw=await user.can("data.write"); if(cw===false) S.canWrite=false; try{ S.canEdit=!!(await user.canEdit()); }catch(e){} }
  Promise.resolve(c.use("sample")).then(x=>{ S.sample=x||null; }).catch(()=>{});
  db.collection("questions").onSnapshot(snap => { S.qs=snap.docs.filter(d=>d.exists).map(d=>({id:d.id, ...d.data()})).filter(q=>q.to && q.text); if(S.loaded && !$("#sheet")) render(); }, ()=>{});
  db.doc("feedback/"+S.meId).onSnapshot(sn => { S.fb = sn.exists ? (sn.data().items||[]) : []; }, ()=>{});
  if(S.canEdit) db.collection("feedback").onSnapshot(snap => { S.fbAll=snap.docs.filter(d=>d.exists).map(d=>({id:d.id, ...d.data()})); if(S.view==="feedback" && !$("#sheet")) render(); }, ()=>{});
  db.collection("threads").onSnapshot(snap => { S.pth=snap.docs.map(d=>({...d.data(), id:d.id})); if(S.loaded && !$("#sheet") && (S.view==="chats"||S.view==="chat")) render(); }, ()=>{});
  db.collection("messages").onSnapshot(snap => { const tmp=S.pmsg.filter(m=>m._tmp), got=snap.docs.map(d=>d.data()); S.pmsg=[...got, ...tmp.filter(t=>!got.some(g=>g._owner===t._owner && g.at===t.at && g.tid===t.tid))]; if(S.loaded && !$("#sheet")) render(); }, ()=>{});
  db.doc("board/deals").onSnapshot(sn => { S.deals = sn.exists ? (sn.data().items||[]) : []; if(S.loaded && !$("#sheet") && S.view==="explore") render(); }, ()=>{});
  const timer=setTimeout(()=>{ S.slow=true; render(); }, 10000);
  db.collection("users").onSnapshot(snap => {
    const next={}; snap.docs.forEach(d=>{ if(d.exists) next[d.id]=d.data(); }); S.raw=next; applyUsers();
    if(!snap.metadata.fromCache){ clearTimeout(timer); S.slow=false; }
    S.loaded=true; if(!$("#sheet")) render(); refreshProfiles();
    if(!S.autoJoin && !next[S.meId]){ S.autoJoin=true; setTimeout(()=>{ if(!mine()) join(); }, 400); }
  }, err => { clearTimeout(timer); S.loaded=true; S.failed = "Adi couldn't load posts right now. Check your connection and reload."; render(); });
  db.doc("data/users/"+S.meId+"/prefs").onSnapshot(s => { if(s.exists && !s.metadata.hasPendingWrites){ S.priv={saved:[], seen:{}, lastActivity:0, hidden:[], blocked:[], muted:[], ...s.data()}; applyUsers(); if(S.loaded && !$("#sheet")) render(); } }, ()=>{});
  refreshProfiles();
})();
</script>
